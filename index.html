<!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');
        
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .mono {
            font-family: 'Space Mono', monospace;
        }
        
        .medical-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .diabetes-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }
        
        .heart-gradient {
            background: linear-gradient(135deg, #ef4444 0%, #ec4899 100%);
        }
        
        .stroke-gradient {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .slide-in {
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .tree-node {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .tree-node:hover {
            transform: scale(1.05);
        }
        
        .highlight-path {
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.8));
            animation: highlight 1.5s ease-in-out infinite alternate;
        }
        
        @keyframes highlight {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

                                    <rect x="325" y="410" width="150" height="60" rx="8" 
                                        :class="strokeResult?.treePath?.includes('leaf2') ? 'fill-yellow-300 stroke-yellow-600 highlight-path' : 'fill-green-100 stroke-green-400'" 
                                        stroke-width="3" class="tree-node"/>
                                    <text x="400" y="435" text-anchor="middle" class="text-sm font-bold fill-green-700">RISQUE FAIBLE</text>
                                    <text x="400" y="455" text-anchor="middle" class="text-xs fill-gray-600">Conf: 40%</text>

                                    <!-- Feuille 3: bp_low + préhypertension_high + antécédents ≤ 0.5 -->
                                    <line x1="600" y1="340" x2="500" y2="410" class="stroke-gray-500" stroke-width="2"/>
                                    <rect x="425" y="410" width="150" height="60" rx="8" 
                                        :class="strokeResult?.treePath?.includes('leaf3') ? 'fill-yellow-300 stroke-yellow-600 highlight-path' : 'fill-red-100 stroke-red-400'" 
                                        stroke-width="3" class="tree-node"/>
                                    <text x="500" y="435" text-anchor="middle" class="text-sm font-bold fill-red-700">RISQUE ÉLEVÉ</text>
                                    <text x="500" y="455" text-anchor="middle" class="text-xs fill-gray-600">Conf: 140%</text>

                                    <!-- Feuille 4: bp_low + préhypertension_high + antécédents > 0.5 -->
                                    <line x1="600" y1="340" x2="700" y2="410" class="stroke-gray-500" stroke-width="2"/>
                                    <rect x="625" y="410" width="150" height="60" rx="8" 
                                        :class="strokeResult?.treePath?.includes('leaf4') ? 'fill-yellow-300 stroke-yellow-600 highlight-path' : 'fill-green-100 stroke-green-400'" 
                                        stroke-width="3" class="tree-node"/>
                                    <text x="700" y="435" text-anchor="middle" class="text-sm font-bold fill-green-700">RISQUE FAIBLE</text>
                                    <text x="700" y="455" text-anchor="middle" class="text-xs fill-gray-600">Conf: 40%</text>

                                    <!-- Feuille 5: bp_normal + stress_low + IMC ≤ 1.042 -->
                                    <line x1="800" y1="340" x2="700" y2="500" class="stroke-gray-500" stroke-width="2"/>
                                    <rect x="625" y="500" width="150" height="60" rx="8" 
                                        :class="strokeResult?.treePath?.includes('leaf5') ? 'fill-yellow-300 stroke-yellow-600 highlight-path' : 'fill-green-100 stroke-green-400'" 
                                        stroke-width="3" class="tree-node"/>
                                    <text x="700" y="525" text-anchor="middle" class="text-sm font-bold fill-green-700">RISQUE FAIBLE</text>
                                    <text x="700" y="545" text-anchor="middle" class="text-xs fill-gray-600">Conf: 30%</text>

                                    <!-- Feuille 6: bp_normal + stress_high + age ≤ -0.303 -->
                                    <line x1="1100" y1="340" x2="1000" y2="500" class="stroke-gray-500" stroke-width="2"/>
                                    <rect x="925" y="500" width="150" height="60" rx="8" 
                                        :class="strokeResult?.treePath?.includes('leaf6') ? 'fill-yellow-300 stroke-yellow-600 highlight-path' : 'fill-green-100 stroke-green-400'" 
                                        stroke-width="3" class="tree-node"/>
                                    <text x="1000" y="525" text-anchor="middle" class="text-sm font-bold fill-green-700">RISQUE FAIBLE</text>
                                    <text x="1000" y="545" text-anchor="middle" class="text-xs fill-gray-600">Conf: 140%</text>

                                    <!-- Feuille 7: bp_normal + stress_high + age > -0.303 -->
                                    <line x1="1100" y1="340" x2="1200" y2="500" class="stroke-gray-500" stroke-width="2"/>
                                    <rect x="1125" y="500" width="150" height="60" rx="8" 
                                        :class="strokeResult?.treePath?.includes('leaf7') ? 'fill-yellow-300 stroke-yellow-600 highlight-path' : 'fill-red-100 stroke-red-400'" 
                                        stroke-width="3" class="tree-node"/>
                                    <text x="1200" y="525" text-anchor="middle" class="text-sm font-bold fill-red-700">RISQUE ÉLEVÉ</text>
                                    <text x="1200" y="545" text-anchor="middle" class="text-xs fill-gray-600">Conf: 140%</text>
                                </svg>
                                
                                <div v-if="strokeResult && strokeResult.treePath" class="mt-6 p-4 bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300 rounded-xl">
                                    <p class="text-sm font-semibold text-yellow-800 flex items-center">
                                        <span class="text-lg mr-2">🔍</span>
                                        Chemin suivi (en jaune): <span class="ml-2 font-bold">{{ strokeResult.treePath.join(' → ') }}</span>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Avertissement -->
                        <div class="bg-gradient-to-r from-yellow-50 to-orange-50 border-2 border-yellow-300 rounded-xl p-4 text-center">
                            <p class="text-sm text-yellow-800 font-medium">
                                ⚠️ Avertissement : Ce système est un outil pédagogique. Consultez un neurologue pour une évaluation réelle du risque d'AVC.
                            </p>
                        </div>
                    </div>
                </div>
            `,
            data() {
                return {
                    showTree: false,
                    strokeData: {
                        bp_history_normal: 0,
                        bp_history_prehypertension: 0,
                        age: 45,
                        family_history_yes: 0,
                        sleep_duration: 7,
                        stress_score: 3,
                        bmi: 25,
                        smoking_status_smoker: 0
                    },
                    strokeParams: [
                        { name: 'bp_history_normal', label: 'Tension artérielle normale', min: 0, max: 1, step: 1, info: '0=Non, 1=Oui', unit: '' },
                        { name: 'bp_history_prehypertension', label: 'Préhypertension', min: 0, max: 1, step: 1, info: '0=Non, 1=Oui', unit: '' },
                        { name: 'age', label: 'Âge', min: 18, max: 100, step: 1, info: 'Âge en années', unit: ' ans' },
                        { name: 'family_history_yes', label: 'Antécédents familiaux', min: 0, max: 1, step: 1, info: '0=Non, 1=Oui', unit: '' },
                        { name: 'sleep_duration', label: 'Durée du sommeil', min: 4, max: 12, step: 0.5, info: 'Heures par nuit', unit: ' h' },
                        { name: 'stress_score', label: 'Score de stress', min: 0, max: 10, step: 1, info: '0=Faible, 10=Élevé', unit: '/10' },
                        { name: 'bmi', label: 'IMC', min: 15, max: 40, step: 0.5, info: 'Indice de masse corporelle', unit: ' kg/m²' },
                        { name: 'smoking_status_smoker', label: 'Tabagisme', min: 0, max: 1, step: 1, info: '0=Non-fumeur, 1=Fumeur', unit: '' }
                    ],
                    strokeResult: null
                };
            },
            methods: {
                normalizeAge(age) {
                    // Normalize age to -1 to 1 scale
                    return ((age - 18) / (100 - 18)) * 2 - 1;
                },
                normalizeSleep(sleep) {
                    // Normalize sleep to -2 to 2 scale
                    return ((sleep - 4) / (12 - 4)) * 4 - 2;
                },
                normalizeBMI(bmi) {
                    // Normalize BMI to 0 to 2 scale
                    return ((bmi - 15) / (40 - 15)) * 2;
                },
                analyzeStroke() {
                    const d = this.strokeData;
                    let rules_applied = [];
                    let treePath = ['root'];
                    let prediction = 'No';
                    let confidence = 0;
                    let recommendations = [];
                    
                    // Rule 1: BP_History_Normal <= 0.5
                    if (d.bp_history_normal === 0) {
                        treePath.push('bp_low');
                        rules_applied.push('Règle 1: Tension artérielle anormale → Risque élevé');
                        
                        // Rule 2: BP_History_Prehypertension <= 0.5
                        if (d.bp_history_prehypertension === 0) {
                            treePath.push('prehypertension_low');
                            rules_applied.push('Règle 2: Pas de préhypertension → Analyse de l\'âge');
                            
                            // Normalize age for comparison
                            const normalizedAge = this.normalizeAge(d.age);
                            
                            // Rule 3: Age <= -0.047 (approx 35 ans)
                            if (normalizedAge <= this.normalizeAge(35)) {
                                treePath.push('age_low', 'leaf1');
                                rules_applied.push('Règle 3: Âge ≤ 35 ans → Risque élevé d\'AVC');
                                prediction = 'Yes';
                                confidence = 60;
                                recommendations.push('Consultation neurologique recommandée', 'Surveillance de la tension artérielle', 'Contrôle régulier des facteurs de risque');
                            } else {
                                treePath.push('age_high', 'leaf2');
                                rules_applied.push('Règle 3: Âge > 35 ans → Risque faible d\'AVC');
                                prediction = 'No';
                                confidence = 40;
                                recommendations.push('Maintenir un mode de vie sain', 'Contrôle annuel recommandé');
                            }
                        } else {
                            treePath.push('prehypertension_high');
                            rules_applied.push('Règle 2: Préhypertension détectée → Vérification antécédents familiaux');
                            
                            // Rule 4: Family_History_Yes <= 0.5
                            if (d.family_history_yes === 0) {
                                treePath.push('family_history_low', 'leaf3');
                                rules_applied.push('Règle 4: Pas d\'antécédents familiaux → Risque élevé d\'AVC');
                                prediction = 'Yes';
                                confidence = 140; // Note: confidence > 100 indique risque très élevé
                                recommendations.push('Consultation neurologique urgente', 'Surveillance intensive', 'Modification du mode de vie nécessaire');
                            } else {
                                treePath.push('family_history_high', 'leaf4');
                                rules_applied.push('Règle 4: Antécédents familiaux présents → Risque faible d\'AVC');
                                prediction = 'No';
                                confidence = 40;
                                recommendations.push('Surveillance régulière', 'Contrôle des facteurs de risque héréditaires');
                            }
                        }
                    } else {
                        treePath.push('bp_normal');
                        rules_applied.push('Règle 1: Tension artérielle normale → Risque faible initial');
                        
                        // Normalize stress score for comparison
                        const normalizedStress = d.stress_score / 10 * 2; // Scale to 0-2
                        
                        // Rule 5: Stress_Score <= 0.814 (approx 4/10)
                        if (normalizedStress <= 0.814) {
                            treePath.push('stress_low');
                            rules_applied.push('Règle 5: Stress faible → Analyse de l\'IMC');
                            
                            // Normalize BMI for comparison
                            const normalizedBMI = this.normalizeBMI(d.bmi);
                            
                            // Rule 6: BMI <= 1.042 (approx 28 kg/m²)
                            if (normalizedBMI <= 1.042) {
                                treePath.push('bmi_low', 'leaf5');
                                rules_applied.push('Règle 6: IMC normal → Risque faible d\'AVC');
                                prediction = 'No';
                                confidence = 30;
                                recommendations.push('Continuer les bonnes habitudes', 'Contrôle annuel standard');
                            } else {
                                treePath.push('bmi_high');
                                // Additional rule would go here for complete tree
                                rules_applied.push('Règle 6: IMC élevé → Analyse supplémentaire nécessaire');
                                prediction = 'No';
                                confidence = 50;
                                recommendations.push('Perte de poids recommandée', 'Surveillance de l\'IMC');
                            }
                        } else {
                            treePath.push('stress_high');
                            rules_applied.push('Règle 5: Stress élevé → Analyse de l\'âge');
                            
                            // Normalize age for comparison
                            const normalizedAge = this.normalizeAge(d.age);
                            
                            // Rule 7: Age <= -0.303 (approx 25 ans)
                            if (normalizedAge <= this.normalizeAge(25)) {
                                treePath.push('age_very_low', 'leaf6');
                                rules_applied.push('Règle 7: Âge ≤ 25 ans → Risque faible d\'AVC');
                                prediction = 'No';
                                confidence = 140;
                                recommendations.push('Gestion du stress recommandée', 'Contrôle régulier');
                            } else {
                                treePath.push('age_not_very_low', 'leaf7');
                                rules_applied.push('Règle 7: Âge > 25 ans → Risque élevé d\'AVC');
                                prediction = 'Yes';
                                confidence = 140;
                                recommendations.push('Consultation neurologique nécessaire', 'Gestion du stress impérative', 'Surveillance intensive');
                            }
                        }
                    }
                    
                    // Additional recommendations based on other factors
                    if (d.smoking_status_smoker === 1) {
                        recommendations.push('Arrêt du tabac fortement recommandé');
                        confidence += 20;
                    }
                    
                    if (d.sleep_duration < 6) {
                        recommendations.push('Amélioration de la durée du sommeil nécessaire');
                        confidence += 10;
                    }
                    
                    // Cap confidence at 100%
                    confidence = Math.min(confidence, 100);
                    
                    this.strokeResult = {
                        prediction,
                        confidence,
                        rules_applied,
                        recommendations,
                        treePath
                    };
                    
                    this.$nextTick(() => {
                        lucide.createIcons();
                    });
                }
            },
            mounted() {
                lucide.createIcons();
            }
        };

        // Application principale
        const App = {
            template: `
                <div>
                    <HomePage v-if="currentPage === 'home'" @navigate="changePage" />
                    <DiabetesExpert v-else-if="currentPage === 'diabetes'" @back="changePage('home')" />
                    <HeartExpert v-else-if="currentPage === 'heart'" @back="changePage('home')" />
                    <StrokeExpert v-else-if="currentPage === 'stroke'" @back="changePage('home')" />
                </div>
            `,
            data() {
                return {
                    currentPage: 'home'
                };
            },
            methods: {
                changePage(page) {
                    this.currentPage = page;
                    window.scrollTo(0, 0);
                    
                    // Reinitialize icons after page change
                    this.$nextTick(() => {
                        lucide.createIcons();
                    });
                }
            },
            mounted() {
                lucide.createIcons();
            }
        };

        // Créer et monter l'application
        const app = createApp(App);
        app.component('HomePage', HomePage);
        app.component('DiabetesExpert', DiabetesExpert);
        app.component('HeartExpert', HeartExpert);
        app.component('StrokeExpert', StrokeExpert);
        app.mount('#app');
    </script>
</body>
</html>
